<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Christian">
<title>Spazio Ireos – Gestionale integrato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{ --bordeaux1:#b43757; --bordeaux2:#c21807; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  /* Layout a colonna: la barra prende l'altezza che le serve, l'app tutto il resto.
     Niente altezze fisse: così la barra si adatta da sola se i pulsanti vanno a capo
     (era il difetto su tablet con quattro pulsanti). */
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    background:#f4f4f6;
    display:flex;flex-direction:column;
    height:100vh; height:100dvh;
    overflow:hidden;
  }

  /* ---- Barra in alto ---- */
  .barra{
    flex:0 0 auto;
    display:flex;align-items:center;flex-wrap:wrap;
    gap:8px 12px;
    padding:9px 14px;
    background:linear-gradient(90deg,var(--bordeaux1),var(--bordeaux2));
    color:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
    z-index:10;
  }
  .titolo{
    font-weight:800;font-size:16px;letter-spacing:.3px;
    display:flex;align-items:center;gap:8px;flex:0 0 auto;
  }
  .titolo .pallino{ width:11px;height:11px;border-radius:50%;background:#fff;opacity:.9;flex:0 0 auto; }
  .rev{
    font-weight:600;font-size:11px;letter-spacing:.2px;
    background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);
    padding:2px 8px;border-radius:999px;white-space:nowrap;flex:0 0 auto;
  }
  .pulsanti{display:flex;gap:8px;flex:1 1 auto;flex-wrap:wrap;min-width:0;}
  .btn{
    appearance:none;border:2px solid rgba(255,255,255,.75);
    background:transparent;color:#fff;
    font-family:inherit;font-weight:600;font-size:14px;
    padding:9px 14px;border-radius:12px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    transition:background .15s ease,border-color .15s ease;
    white-space:nowrap;flex:0 1 auto;min-height:42px;
  }
  .btn:hover{border-color:#fff;background:rgba(255,255,255,.12);}
  .btn .ico{font-size:17px;line-height:1;}
  .btn.attivo{ background:#fff;color:var(--bordeaux2);border-color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2); }

  /* ---- Area applicazione: tutto lo spazio che resta ---- */
  .area{ flex:1 1 auto;min-height:0;background:#fff; }
  iframe#app{ width:100%;height:100%;border:0;display:block; }

  /* Larghezze medie (tablet): testo un po' piu' compatto, i pulsanti riempiono la riga */
  @media (max-width:1100px){
    .titolo{font-size:15px;}
    .btn{font-size:13px;padding:9px 11px;gap:6px;flex:1 1 auto;}
    .btn .ico{font-size:16px;}
  }
  /* Schermi stretti: titolo su una riga a se', pulsanti a griglia su due righe */
  @media (max-width:640px){
    .barra{padding:8px 10px;gap:7px;}
    .titolo{width:100%;font-size:14px;}
    .pulsanti{width:100%;}
    .btn{flex:1 1 44%;font-size:13px;padding:10px 8px;}
  }
</style>
</head>
<body>
  <header class="barra">
    <div class="titolo"><span class="pallino"></span>SPAZIO IREOS · Gestionale integrato</div>
    <span class="rev" title="Revisione di questa pagina: serve a capire a colpo d'occhio se stai vedendo la versione aggiornata">rev 3 · 29ott26</span>
    <nav class="pulsanti">
      <button class="btn" id="btn-collaboratori" type="button" onclick="apri('collaboratori')">
        <span class="ico">&#128101;</span> Collaboratori
      </button>
      <button class="btn" id="btn-dipendenti" type="button" onclick="apri('dipendenti')">
        <span class="ico">&#129333;</span> Dipendenti
      </button>
      <button class="btn" id="btn-rendicontazione" type="button" onclick="apri('rendicontazione')">
        <span class="ico">&#128202;</span> Rendicontazione progetti
      </button>
      <button class="btn" id="btn-fogliore" type="button" onclick="apri('fogliore')">
        <span class="ico">&#128203;</span> Fogli ore
      </button>
    </nav>
  </header>

  <main class="area">
    <iframe id="app" title="Applicazione" src="https://spazioireos.github.io/ore-e-importi-collaboratori/"></iframe>
  </main>

<script>
  /* Ogni sezione apre il LINK LIVE della sua app: ogni app si aggiorna una volta sola
     nel suo repository e qui si vede la versione nuova da se'. */
  var SEZIONI = {
    collaboratori:   { url:'https://spazioireos.github.io/ore-e-importi-collaboratori/', btn:'btn-collaboratori',   titolo:'Collaboratori' },
    dipendenti:      { url:'https://spazioireos.github.io/ore-mensili-dipendenti/',      btn:'btn-dipendenti',      titolo:'Dipendenti' },
    rendicontazione: { url:'https://spazioireos.github.io/rendicontazione-usoint/',      btn:'btn-rendicontazione', titolo:'Rendicontazione progetti' },
    fogliore:        { url:'https://spazioireos.github.io/spazioireos-foglio-ore/',      btn:'btn-fogliore',        titolo:'Fogli ore' }
  };
  var CHIAVE = 'spazioireos_integrato_tab';

  function apri(nome){
    var s = SEZIONI[nome] || SEZIONI.collaboratori;
    var frame = document.getElementById('app');
    if (frame.getAttribute('data-sezione') !== nome){
      frame.src = s.url;
      frame.setAttribute('data-sezione', nome);
    }
    for (var k in SEZIONI){
      var b = document.getElementById(SEZIONI[k].btn);
      if (b) b.classList.toggle('attivo', k === nome);
    }
    try { localStorage.setItem(CHIAVE, nome); } catch(e){}
    document.title = 'Spazio Ireos – ' + s.titolo;
  }

  (function(){
    var iniziale = 'collaboratori';
    try {
      var salvata = localStorage.getItem(CHIAVE);
      if (salvata && SEZIONI[salvata]) iniziale = salvata;
    } catch(e){}
    apri(iniziale);
  })();
</script>
</body>
</html>
