<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Christian">
<title>Spazio Ireos – Gestionale integrato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bordeaux1:#b43757;
    --bordeaux2:#c21807;
    --barra-h:72px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    background:#f4f4f6;
    overflow:hidden;
  }

  /* ---- Barra in alto ---- */
  .barra{
    position:fixed;top:0;left:0;right:0;height:var(--barra-h);
    display:flex;align-items:center;gap:16px;
    padding:0 18px;
    background:linear-gradient(90deg,var(--bordeaux1),var(--bordeaux2));
    color:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
    z-index:10;
  }
  .titolo{
    font-weight:800;font-size:17px;letter-spacing:.3px;
    white-space:nowrap;margin-right:6px;
    display:flex;align-items:center;gap:8px;
  }
  .titolo .pallino{
    width:12px;height:12px;border-radius:50%;background:#fff;opacity:.9;flex:0 0 auto;
  }
  .rev{
    font-weight:600;font-size:11px;letter-spacing:.2px;
    background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);
    padding:2px 8px;border-radius:999px;margin-left:10px;white-space:nowrap;
  }
  .pulsanti{display:flex;gap:10px;flex:1 1 auto;flex-wrap:wrap;}
  .btn{
    appearance:none;border:2px solid rgba(255,255,255,.75);
    background:transparent;color:#fff;
    font-family:inherit;font-weight:600;font-size:15px;
    padding:10px 16px;border-radius:12px;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;
    transition:all .15s ease;white-space:nowrap;
  }
  .btn:hover{border-color:#fff;background:rgba(255,255,255,.12);}
  .btn .ico{font-size:18px;line-height:1;}
  .btn.attivo{
    background:#fff;color:var(--bordeaux2);border-color:#fff;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
  }

  /* ---- Area applicazione ---- */
  .area{
    position:fixed;top:var(--barra-h);left:0;right:0;bottom:0;
    background:#fff;
  }
  iframe#app{
    width:100%;height:100%;border:0;display:block;
  }

  /* Su schermi piccoli: titolo su una riga, pulsanti a tutta larghezza */
  @media (max-width:720px){
    :root{--barra-h:150px;}
    .barra{flex-wrap:wrap;align-content:center;padding:8px 12px;gap:8px;}
    .titolo{font-size:15px;width:100%;}
    .pulsanti{width:100%;}
    .btn{flex:1 1 40%;justify-content:center;font-size:14px;padding:10px 8px;}
  }
</style>
</head>
<body>
  <header class="barra">
    <div class="titolo"><span class="pallino"></span>SPAZIO IREOS · Gestionale integrato<span class="rev" title="Revisione di questa pagina: serve a capire a colpo d occhio se stai vedendo la versione aggiornata">rev 2 · 29ott26</span></div>
    <nav class="pulsanti">
      <button class="btn" id="btn-collaboratori" type="button" onclick="apri('collaboratori')">
        <span class="ico">👥</span> Collaboratori
      </button>
      <button class="btn" id="btn-dipendenti" type="button" onclick="apri('dipendenti')">
        <span class="ico">🧑‍💼</span> Dipendenti
      </button>
      <button class="btn" id="btn-rendicontazione" type="button" onclick="apri('rendicontazione')">
        <span class="ico">📊</span> Rendicontazione progetti
      </button>
      <button class="btn" id="btn-fogliore" type="button" onclick="apri(&#39;fogliore&#39;)">
        <span class="ico">📋</span> Fogli ore
      </button>
    </nav>
  </header>

  <main class="area">
    <iframe id="app" title="Applicazione" src="https://spazioireos.github.io/ore-e-importi-collaboratori/"></iframe>
  </main>

<script>
  // Ogni sezione apre il LINK LIVE della sua app: così ogni app si aggiorna
  // una volta sola nel suo repository e qui si vede la versione nuova da sé.
  var SEZIONI = {
    collaboratori:   { url:'https://spazioireos.github.io/ore-e-importi-collaboratori/', btn:'btn-collaboratori',   titolo:'Collaboratori' },
    dipendenti:      { url:'https://spazioireos.github.io/ore-mensili-dipendenti/',      btn:'btn-dipendenti',      titolo:'Dipendenti' },
    rendicontazione: { url:'https://spazioireos.github.io/rendicontazione-usoint/',      btn:'btn-rendicontazione', titolo:'Rendicontazione progetti' },
    fogliore:        { url:'https://spazioireos.github.io/spazioireos-foglio-ore/',    btn:'btn-fogliore',        titolo:'Fogli ore' }
  };
  var CHIAVE = 'spazioireos_integrato_tab';

  function apri(nome){
    var s = SEZIONI[nome] || SEZIONI.collaboratori;
    var frame = document.getElementById('app');
    // Cambia pagina solo se diversa, per non ricaricare inutilmente
    if (frame.getAttribute('data-sezione') !== nome){
      frame.src = s.url;
      frame.setAttribute('data-sezione', nome);
    }
    // Evidenzia il pulsante attivo
    for (var k in SEZIONI){
      var b = document.getElementById(SEZIONI[k].btn);
      if (b) b.classList.toggle('attivo', k === nome);
    }
    // Ricorda l'ultima sezione aperta
    try { localStorage.setItem(CHIAVE, nome); } catch(e){}
    document.title = 'Spazio Ireos – ' + s.titolo;
  }

  // All'avvio riapre l'ultima sezione usata (default: Collaboratori)
  (function(){
    var iniziale = 'collaboratori';
    try {
      var salvata = localStorage.getItem(CHIAVE);
      if (salvata && SEZIONI[salvata]) iniziale = salvata;
    } catch(e){}
    apri(iniziale);
  })();
</script>
</body>
</html>
