        React.createElement("h2",null,"Errore nell'applicazione"),

function isoToIt(iso){if(!iso)return"";var p=String(iso).split("-");if(p.length!==3)return iso;return p[2]+"/"+p[1]+"/"+p[0]}
function itToIso(it){if(!it)return"";var s=String(it).trim().replace(/-/g,"/").replace(/\./g,"/");var p=s.split("/");if(p.length!==3)return"";var g=p[0].padStart(2,"0"),m=p[1].padStart(2,"0"),a=p[2];if(a.length===2)a="20"+a;if(g.length>2||m.length>2||a.length!==4)return"";if(+m<1||+m>12||+g<1||+g>31)return"";return a+"-"+m+"-"+g}

function cP(p,cy,vin,yOv){const E=p.eur,D=p.oreT,H=p.cofin,F=D*E,G=F-H,I=F?G*100/F:0,J=100-I;const yrs=[];let carry=0;for(let yi=0;yi<cy.length;yi++){const c=cy[yi],md=p.md[yi]||Array(12).fill(0);const eRate=(p.eurA&&p.eurA[yi])?p.eurA[yi]:E;const yI=(yOv&&yOv[yi]!=null)?yOv[yi]:I,yJ=100-yI;const oE=c.months.reduce((a,m)=>a+((m.disabled||isMeseCessato(p.cessato,c.year,m.month))?0:(md[m.month]||0)),0),iE=oE*eRate,oA=p.aOre[yi]||0,iAlloc=oA*eRate,oD=oA+carry,oR=oD-oE,el=p.aElim[yi]||0,pc=oD>0?oE/oD*100:0;const ov=vin&&oA>0&&oE>oD,nr=vin&&oA>0&&pc>=90&&!ov;yrs.push({oA,oD,oE,iE,oR,el,pc,ov,nr,eRate,iAlloc,yI,yJ,mI:md.map(o=>o*eRate)});carry=oR-el}const tO=yrs.reduce((a,y)=>a+y.oE,0),tI=yrs.reduce((a,y)=>a+y.iE,0);const tFin=yrs.reduce((a,y)=>a+y.iE*y.yI/100,0);const lastE=yrs.length&&yrs[yrs.length-1].eRate||E;const fR=yrs.length?yrs[yrs.length-1].oR-yrs[yrs.length-1].el:0;return{F,G,I,J,yrs,tO,tI,fR,fRI:fR*lastE,EX:tFin}}

const parseNum=(s)=>{if(!s||s==="")return 0;var clean=String(s).trim();if(clean.indexOf(",")>=0&&clean.indexOf(".")>=0){clean=clean.replace(/\./g,"").replace(",",".")}else if(clean.indexOf(",")>=0){clean=clean.replace(",",".")}else if(clean.indexOf(".")>=0){var parts=clean.split(".");if(parts.length===2&&parts[1].length<=2){/* dot as decimal, keep */}else{clean=clean.replace(/\./g,"")}}var n=parseFloat(clean);return isNaN(n)?0:Math.round(n*100)/100};

function App(){
  const[projects,setProjects]=useState([]);const[aid,setAid]=useState(null);const[ld,setLd]=useState(true);

  const[pinVal,setPinVal]=useState("");
  const[pinErr,setPinErr]=useState("");

  const[pinVal2,setPinVal2]=useState("");
  const[syncing,setSyncing]=useState(false);

    var unsub=fbAuth.onAuthStateChanged(function(user){

        fbSync(user.uid).then(function(n){
          var r=LS.get("usoint-idx");if(r)setProjects(JSON.parse(r.value));

        }).catch(function(err){console.error("Sync error:",err);

      fbAuth.createUserWithEmailAndPassword(pinVal,pinVal2).then(function(){setSyncing(false)}).catch(function(err){setSyncing(false);setPinErr(err.message)});
    }else{
      fbAuth.signInWithEmailAndPassword(pinVal,pinVal2).then(function(){setSyncing(false)}).catch(function(err){

      {!show&&<>{projects.length===0&&<div style={{textAlign:"center",padding:48,color:"#94a3b8",fontSize:14}}>Nessun progetto ancora.</div>}
        {projects.map(p=>{const c2=calcCY(p.start,p.end);return<div key={p.id} style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:16,marginBottom:10,display:"flex",alignItems:"center",gap:12,boxShadow:"0 1px 3px rgba(0,0,0,.06)",cursor:"pointer"}} onClick={()=>onOpen(p.id)}>

        </div>})}
        <button onClick={()=>setShow(true)} style={{...bPri,width:"100%",marginTop:14}}>+ Nuovo Progetto</button>
        <div style={{display:"flex",gap:8,marginTop:10}}>
          <button onClick={function(){
            var bk={};for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k.indexOf("usoint")===0)bk[k]=localStorage.getItem(k)}
            var bl=new Blob([JSON.stringify(bk,null,2)],{type:"application/json"});

          <button onClick={function(){
            var inp=document.createElement("input");inp.type="file";inp.accept=".json";
            inp.onchange=function(e){
              var f=e.target.files[0];if(!f)return;
              var rd=new FileReader();rd.onload=function(ev){
                try{
                  var d=JSON.parse(ev.target.result);var n=0;
                  for(var k in d){if(k.indexOf("usoint")===0){localStorage.setItem(k,d[k]);n++}}
                  alert("Ripristinati "+n+" elementi. La pagina si ricaricherà.");location.reload();
                }catch(ex){alert("File non valido: "+ex.message)}

        {ws===1&&<div style={wC}><h3 style={wH}>2. Vincolo annuale</h3><p style={{fontSize:13,color:"#475569",lineHeight:1.7,marginBottom:16}}>Ogni anno ha un tetto obbligatorio di consumo?</p><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}><button onClick={()=>{setCf(p=>({...p,vincolo:true}));setWs(2)}} style={{...bCh,border:cf.vincolo===true?"2.5px solid #d97706":"2px solid #e2e8f0",background:cf.vincolo===true?"#fffbeb":"#fff"}}><div style={{fontSize:22}}>🔒</div><div style={{fontSize:13,fontWeight:700,color:"#92400e",marginTop:6}}>Sì</div></button><button onClick={()=>{setCf(p=>({...p,vincolo:false}));setWs(2)}} style={{...bCh,border:cf.vincolo===false?"2.5px solid #16a34a":"2px solid #e2e8f0",background:cf.vincolo===false?"#f0fdf4":"#fff"}}><div style={{fontSize:22}}>🔓</div><div style={{fontSize:13,fontWeight:700,color:"#166534",marginTop:6}}>No</div></button></div><button onClick={()=>setWs(0)} style={{...bSec,marginTop:14,width:"100%"}}>← Indietro</button></div>}
        {ws===2&&<div style={wC}><h3 style={wH}>3. Dimensioni</h3><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}><div><label style={lbl}>Personale</label><In value={cf.nP} onChange={v=>setCf(p=>({...p,nP:Math.max(1,Math.min(20,v))}))} step="1"/></div><div><label style={lbl}>Beni/Servizi</label><In value={cf.nB} onChange={v=>setCf(p=>({...p,nB:Math.max(1,Math.min(15,v))}))} step="1"/></div></div><div style={{display:"flex",gap:8,marginTop:16}}><button onClick={()=>setWs(1)} style={{...bSec,flex:1}}>← Indietro</button><button onClick={go} style={{...bPri,flex:1}}>✓ Crea</button></div></div>}
      </div>}
    </div>
  </div>);
}

function PV({pid,onBack}){
  const[data,setData]=useState(null);const[aYI,setAYI]=useState(0);const[mo,setMo]=useState(false);const[saved,setSaved]=useState(false);const[finAlertDismissed,setFinAlertDismissed]=useState(false);
  const[riassExp,setRiassExp]=useState({});
  const[riassQty,setRiassQty]=useState({});
  const[riassTo,setRiassTo]=useState({});
  useEffect(()=>{
    try{
      const r=LS.get("usoint-p-"+pid);
      if(r){
        var d=JSON.parse(r.value);
        if(!d.fatture)d.fatture=[];
        if(!d.colore)d.colore="#e3f0fc";
        var nYrs=calcCY(d.start,d.end).length||10;
        if(!d.finAnno)d.finAnno=Array(nYrs).fill(0);
        if(!d.rettFin)d.rettFin=Array(nYrs).fill(0);
        (d.personnel||[]).forEach(function(p){
          if(p.cessato===undefined)p.cessato="";
          if(!p.eurA)p.eurA=Array(nYrs).fill(0);
          if(!p.aElim)p.aElim=Array(nYrs).fill(0);
          if(!p.aOre)p.aOre=Array(nYrs).fill(0);
          if(!p.md)p.md=Array.from({length:nYrs},function(){return Array(12).fill(0)});
        });
        (d.beni||[]).forEach(function(b){
          if(!b.aElim)b.aElim=Array(nYrs).fill(0);
          if(!b.aImp)b.aImp=Array(nYrs).fill(0);
          if(!b.md)b.md=Array.from({length:nYrs},function(){return Array(12).fill(0)});
        });
        setData(d);
      }
    }catch(ex){console.error("Errore caricamento progetto:",ex)}
  },[pid]);
  const save=()=>{setData(prev=>{if(prev)LS.set("usoint-p-"+pid,JSON.stringify(prev));return prev});setSaved(true);setTimeout(()=>setSaved(false),1500)};
  const upd=fn=>setData(prev=>fn(prev));
  const rinominaTitolo=()=>{
    var att=(data&&data.title)||"";
    var nuovo=prompt("Rinomina il lavoro:",att);
    if(nuovo===null)return;
    nuovo=nuovo.trim();
    if(nuovo==="")return alert("Il titolo non può essere vuoto");
    upd(function(d){return Object.assign({},d,{title:nuovo})});
    setData(function(prev){var n=Object.assign({},prev,{title:nuovo});LS.set("usoint-p-"+pid,JSON.stringify(n));return n});
    try{var r=LS.get("usoint-idx");if(r){var idx=JSON.parse(r.value).map(function(p){return p.id===pid?Object.assign({},p,{title:nuovo}):p});LS.set("usoint-idx",JSON.stringify(idx))}}catch(ex){}
  };
  const cy=useMemo(()=>data?calcCY(data.start,data.end):[],[data&&data.start,data&&data.end]);const nY=cy.length;
  const yOv=useMemo(function(){
    if(!data)return null;
    var fa=data.finAnno||[];
    var rf=data.rettFin||[];
    var p0=(data.personnel||[]).map(function(p){return cP(p,cy,false,null)});
    var b0=(data.beni||[]).map(function(b){return cB(b,cy,false,null)});
    return cy.map(function(y,yi){
      var spent=p0.reduce(function(a,c){return a+(c.yrs[yi]?c.yrs[yi].iE:0)},0)+b0.reduce(function(a,c){return a+(c.yrs[yi]?c.yrs[yi].iE:0)},0);
      if(spent<=0)return null;
      // finanziato effettivo inserito: ha priorità
      if(fa[yi]>0)return Math.min(fa[yi]/spent*100,100);
      // altrimenti, se c'è una rettifica (eccedenza scaricata da un anno precedente), riduce il finanziato a budget
      if(rf[yi]&&rf[yi]>0){
        var baseFin=spent*(p0.length||b0.length?( (function(){var tF=p0.reduce(function(a,c){return a+c.F},0)+b0.reduce(function(a,c){return a+c.F},0);var tG=p0.reduce(function(a,c){return a+c.G},0)+b0.reduce(function(a,c){return a+c.G},0);return tF>0?tG/tF:0})() ):0);
        var finRett=Math.max(0,baseFin-rf[yi]);
        return Math.min(finRett/spent*100,100);
      }
      return null;
    });
  },[data&&data.personnel,data&&data.beni,data&&data.finAnno,data&&data.rettFin,cy]);
  const pC=useMemo(()=>(data&&data.personnel||[]).map(p=>cP(p,cy,data&&data.vincolo,yOv)),[data&&data.personnel,cy,data&&data.vincolo,yOv]);
  const bC=useMemo(()=>(data&&data.beni||[]).map(b=>cB(b,cy,data&&data.vincolo,yOv)),[data&&data.beni,cy,data&&data.vincolo,yOv]);
  const hA=pC.some(c=>c.yrs&&c.yrs.some(y=>y.ov))||bC.some(c=>c.yrs&&c.yrs.some(y=>y.ov));
  if(!data)return<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:"#94a3b8"}}>Caricamento...</div>;
  const P=data.personnel||[],B=data.beni||[],cyr=cy[aYI]||cy[0];
  const uFA=(yi,v)=>upd(d=>{const fa=[...(d.finAnno||Array(nY).fill(0))];fa[yi]=v;return{...d,finAnno:fa}});
  const proponiPropagazione=(yi)=>{
    // calcola spesa e finanziato a budget dell'anno yi, confronta con effettivo, propone rettifica su yi+1
    var fa=data.finAnno||[];var eff=fa[yi]||0;
    if(eff<=0)return;
    var p0=(data.personnel||[]).map(function(p){return cP(p,cy,false,null)});
    var b0=(data.beni||[]).map(function(b){return cB(b,cy,false,null)});
    var spent=p0.reduce(function(a,c){return a+(c.yrs[yi]?c.yrs[yi].iE:0)},0)+b0.reduce(function(a,c){return a+(c.yrs[yi]?c.yrs[yi].iE:0)},0);
    var tF=p0.reduce(function(a,c){return a+c.F},0)+b0.reduce(function(a,c){return a+c.F},0);
    var tG=p0.reduce(function(a,c){return a+c.G},0)+b0.reduce(function(a,c){return a+c.G},0);
    var pctBase=tF>0?tG/tF:0;
    var budgetBase=Math.round(spent*pctBase*100)/100;
    var rfArr=data.rettFin||[];
    var budgetFin=Math.round((budgetBase-((rfArr[yi]||0)))*100)/100;
    var ecc=Math.round((eff-budgetFin)*100)/100;
    if(ecc<=0.001){alert("Il finanziato effettivo dell'anno "+(cy[yi]?cy[yi].year:"")+" ("+fmtE(eff)+") non supera il finanziato a budget ("+fmtE(budgetFin)+"). Nessuna propagazione necessaria.");return;}
    // primo anno utile successivo
    if(yi+1>=cy.length){alert("L'eccedenza di "+fmtE(ecc)+" è sull'ultima annualità: non ci sono anni successivi su cui propagarla. Il tetto totale del finanziatore non viene superato (anticipa di più e trattiene dopo).");return;}
    var annoSucc=cy[yi+1]?cy[yi+1].year:"";
    var vincolato=!!data.vincolo;
    var intro=vincolato
      ?"PROGETTO VINCOLATO.\n\nNel "+(cy[yi]?cy[yi].year:"")+" il finanziato effettivo ("+fmtE(eff)+") supera il finanziato a budget ("+fmtE(budgetFin)+") di "+fmtE(ecc)+".\n\nNel vincolato ogni anno è chiuso: la propagazione NON è automatica. Applicala SOLO se il Comune ha deciso di recuperare questa eccedenza comprimendo l'anno successivo."
      :"PROGETTO LIBERO.\n\nNel "+(cy[yi]?cy[yi].year:"")+" il finanziato effettivo ("+fmtE(eff)+") supera il finanziato a budget ("+fmtE(budgetFin)+") di "+fmtE(ecc)+".\n\nIl finanziatore ha un tetto totale: questa eccedenza riduce il finanziato disponibile per gli anni successivi.";
    var msg=intro+"\n\nVuoi ridurre di "+fmtE(ecc)+" il finanziato a budget del "+annoSucc+" (con corrispondente aumento del cofinanziamento di quell'anno)?";
    if(window.confirm(msg)){
      upd(function(d){var rf=[...(d.rettFin||Array(nY).fill(0))];rf[yi+1]=Math.round(((rf[yi+1]||0)+ecc)*100)/100;return Object.assign({},d,{rettFin:rf})});
    }
  };
  const resetRett=(yi)=>{if(window.confirm("Azzerare la rettifica di finanziamento del "+(cy[yi]?cy[yi].year:"")+" ("+fmtE((data.rettFin&&data.rettFin[yi])||0)+")?"))upd(function(d){var rf=[...(d.rettFin||Array(nY).fill(0))];rf[yi]=0;return Object.assign({},d,{rettFin:rf})});};
  const uP=(i,k,v)=>upd(d=>{const a=[...d.personnel];a[i]={...a[i],[k]:v};return{...d,personnel:a}});
  const uPA=(i,yi,v)=>upd(d=>{const a=[...d.personnel];const o=[...a[i].aOre];o[yi]=v;if(yi===0){for(let j=1;j<o.length;j++)if(o[j]===0)o[j]=v}a[i]={...a[i],aOre:o};return{...d,personnel:a}});
  const uPEA=(i,yi,v)=>upd(d=>{const a=[...d.personnel];const ea=[...(a[i].eurA||Array(nY).fill(0))];ea[yi]=v;a[i]={...a[i],eurA:ea};return{...d,personnel:a}});
  const eR=(p,yi)=>(p.eurA&&p.eurA[yi])?p.eurA[yi]:p.eur;
  const uPE=(i,yi,v)=>upd(d=>{const a=[...d.personnel];const o=[...a[i].aElim];o[yi]=v;a[i]={...a[i],aElim:o};return{...d,personnel:a}});
  const uPM=(i,yi,mi,v)=>upd(d=>{const a=[...d.personnel];const md=a[i].md.map(r=>[...r]);md[yi][mi]=v;a[i]={...a[i],md};return{...d,personnel:a}});
  const trasferisciOre=(fromIdx,toIdx,yi,resOre,consumato)=>{
    if(fromIdx===toIdx)return alert("Operatore destinatario non valido");
    var oreNum=parseFloat(String(resOre).replace(",","."));
    if(isNaN(oreNum)||oreNum<=0)return alert("Quantità di ore non valida");
    upd(function(d){
      var a=d.personnel.map(function(p){return Object.assign({},p,{aOre:[...p.aOre]})});
      // porto l'allocazione del cessato esattamente al consumato -> residuo azzerato per costruzione
      var cons=Math.round((consumato||0)*100)/100;
      a[fromIdx].aOre[yi]=Math.max(0,cons);
      a[toIdx].aOre[yi]=Math.round(((a[toIdx].aOre[yi]||0)+oreNum)*100)/100;
      return Object.assign({},d,{personnel:a});
    });
  };
  const trasferisciLibero=(fromIdx,toIdx,yiDest,saldoOre,residuiPerAnno)=>{
    if(fromIdx===toIdx)return alert("Operatore destinatario non valido");
    var saldo=Math.round((saldoOre||0)*100)/100;
    if(saldo<=0.001)return alert("Nessun residuo disponibile da trasferire (l'operatore ha consumato tutte le ore ricevute).");
    upd(function(d){
      var a=d.personnel.map(function(p){return Object.assign({},p,{aOre:[...p.aOre]})});
      // Azzero il saldo del cessato: riduco le sue allocazioni (dalla prima annualità) dell'esatto saldo residuo,
      // così il suo saldo finale col carry diventa 0 (niente più da riassegnare).
      var daRidurre=saldo;
      for(var yi=0;yi<a[fromIdx].aOre.length && daRidurre>0.001;yi++){
        var disp=a[fromIdx].aOre[yi]||0;
        var taglio=Math.min(disp,daRidurre);
        a[fromIdx].aOre[yi]=Math.round((disp-taglio)*100)/100;
        daRidurre=Math.round((daRidurre-taglio)*100)/100;
      }
      // Accredito il saldo al destinatario sulla annualità di destinazione (prima annualità nel libero)
      a[toIdx].aOre[yiDest]=Math.round(((a[toIdx].aOre[yiDest]||0)+saldo)*100)/100;
      return Object.assign({},d,{personnel:a});
    });
  };
  const trasferisciBeneAnno=(fromIdx,toIdx,yi,resImp,speso)=>{
    if(fromIdx===toIdx)return alert("Voce destinataria non valida");
    var impNum=parseFloat(String(resImp).replace(",","."));
    if(isNaN(impNum)||impNum<=0)return alert("Importo non valido");
    upd(function(d){
      var a=d.beni.map(function(b){return Object.assign({},b,{aImp:[...b.aImp]})});
      // porto l'allocazione della voce esattamente allo speso -> avanzo azzerato per costruzione
      a[fromIdx].aImp[yi]=Math.max(0,Math.round((speso||0)*100)/100);
      a[toIdx].aImp[yi]=Math.round(((a[toIdx].aImp[yi]||0)+impNum)*100)/100;
      return Object.assign({},d,{beni:a});
    });
  };
  const trasferisciBeneLibero=(fromIdx,toIdx,yiCorrente,avanziPerAnno)=>{
    if(fromIdx===toIdx)return alert("Voce destinataria non valida");
    upd(function(d){
      var a=d.beni.map(function(b){return Object.assign({},b,{aImp:[...b.aImp]})});
      var impTot=0;
      avanziPerAnno.forEach(function(r){
        a[fromIdx].aImp[r.yi]=Math.max(0,Math.round((r.speso||0)*100)/100);
        impTot+=r.resImp;
      });
      impTot=Math.round(impTot*100)/100;
      a[toIdx].aImp[yiCorrente]=Math.round(((a[toIdx].aImp[yiCorrente]||0)+impTot)*100)/100;
      return Object.assign({},d,{beni:a});
    });
  };
  const uB=(i,k,v)=>upd(d=>{const a=[...d.beni];a[i]={...a[i],[k]:v};return{...d,beni:a}});
  const uBA=(i,yi,v)=>upd(d=>{const a=[...d.beni];const o=[...a[i].aImp];o[yi]=v;if(yi===0){for(let j=1;j<o.length;j++)if(o[j]===0)o[j]=v}a[i]={...a[i],aImp:o};return{...d,beni:a}});
  const uBE=(i,yi,v)=>upd(d=>{const a=[...d.beni];const o=[...a[i].aElim];o[yi]=v;a[i]={...a[i],aElim:o};return{...d,beni:a}});
  const uBM=(i,yi,mi,v)=>upd(d=>{const a=[...d.beni];const md=a[i].md.map(r=>[...r]);md[yi][mi]=v;a[i]={...a[i],md};return{...d,beni:a}});
  const addR=t=>upd(d=>t==="p"?{...d,personnel:[...d.personnel,mkP(nY)]}:{...d,beni:[...d.beni,mkB(nY)]});
  const spostaPers=(i,dir)=>{var j=i+dir;upd(function(d){if(j<0||j>=d.personnel.length)return d;var a=[...d.personnel];var t=a[i];a[i]=a[j];a[j]=t;return{...d,personnel:a}})};
  const spostaBene=(i,dir)=>{var j=i+dir;upd(function(d){if(j<0||j>=d.beni.length)return d;var a=[...d.beni];var t=a[i];a[i]=a[j];a[j]=t;return{...d,beni:a}})};
  const elimUltimoPers=()=>{
    if(!data||data.personnel.length<=1)return;

    var nome=p.nome||("Op."+(idx+1));
    if(oreTot>0.001){
      var impTot=(p.aOre||[]).reduce(function(a,v,yi){return a+(v||0)*eR(p,yi)},0);
      var msg="⚠ ATTENZIONE: stai per eliminare \""+nome+"\".\n\nQuesto operatore ha ore/importi allocati: "+grp(oreTot,2)+" ore (≈ "+fmtE(impTot)+").";
      if(p.cessato)msg+="\n\n⚠ È un operatore CESSATO con residui: se non li hai ancora ridistribuiti, li perderai!";

      msg+="\n\nTi consiglio di ANNULLARE e ridistribuire prima le ore nella sezione di riassegnazione.\n\nVuoi eliminarlo comunque (perdendo le ore allocate)?";
      if(!window.confirm(msg))return;
    }
    upd(function(d){var a=[...d.personnel];a.pop();return{...d,personnel:a}});
  };
  const elimUltimoBene=()=>{
    if(!data||data.beni.length<=1)return;
    var idx=data.beni.length-1;var b=data.beni[idx];
    var impTot=(b.aImp||[]).reduce(function(a,v){return a+(v||0)},0);
    var nome=b.voce||("Voce "+(idx+1));
    if(impTot>0.001){
      var msg="⚠ ATTENZIONE: stai per eliminare la voce \""+nome+"\".\n\nQuesta voce ha importi allocati: "+fmtE(impTot)+".";
      msg+="\n\n⚠ Se questa voce è un ASSEGNATARIO (ha ricevuto avanzi di un'altra voce), eliminandola quegli avanzi andranno persi e dovrai riassegnarli.";
      msg+="\n\nTi consiglio di ANNULLARE e ridistribuire prima gli importi nella sezione avanzi Beni/Servizi.\n\nVuoi eliminarla comunque (perdendo gli importi allocati)?";

  const updFatt=(i,k,v)=>upd(d=>{const f=[...(d.fatture||[])];f[i]={...f[i],[k]:v};return{...d,fatture:f}});
  const delFatt=(i)=>upd(d=>{const f=[...(d.fatture||[])];f.splice(i,1);return{...d,fatture:f}});

  const proroga=function(){
    var newEnd=prompt("Nuova data fine progetto (AAAA-MM-GG):",data.end);

    var newCY=calcCY(data.start,newEnd);var oldN=cy.length;var addN=newCY.length-oldN;
    if(addN<=0){alert("La nuova data non aggiunge anni.");return}
    upd(function(d){
      var np=d.personnel.map(function(p){
        var aOre=[].concat(p.aOre||[]);while(aOre.length<newCY.length)aOre.push(0);
        var aElim=[].concat(p.aElim||[]);while(aElim.length<newCY.length)aElim.push(0);
        var eurA=[].concat(p.eurA||[]);while(eurA.length<newCY.length)eurA.push(0);
        var md=[].concat(p.md||[]);while(md.length<newCY.length)md.push(Array(12).fill(0));
        return Object.assign({},p,{aOre:aOre,aElim:aElim,eurA:eurA,md:md});
      });
      var nb=d.beni.map(function(b){
        var aImp=[].concat(b.aImp||[]);while(aImp.length<newCY.length)aImp.push(0);
        var aElim=[].concat(b.aElim||[]);while(aElim.length<newCY.length)aElim.push(0);
        var md=[].concat(b.md||[]);while(md.length<newCY.length)md.push(Array(12).fill(0));
        return Object.assign({},b,{aImp:aImp,aElim:aElim,md:md});
      });
      return Object.assign({},d,{end:newEnd,personnel:np,beni:nb});
    });
    alert("Progetto prorogato fino al "+newEnd.split("-").reverse().join("/")+". Aggiunti "+addN+" anno/i.");
  };

    bRows.push([]);bRows.push(["BENI/SERVIZI — BUDGET"]);bRows.push(["Voce di spesa","","","Imp.prev.","Cofinanz.","Finanz.","%F","%C"]);
    B.forEach(function(b,i){var c=bC[i];bRows.push([b.voce||"Voce "+(i+1),"","",b.forf,b.cofin,c.G,c.I/100,c.J/100])});
    var ws1=XLSX.utils.aoa_to_sheet(bRows);

      var ws=XLSX.utils.aoa_to_sheet(rows);

    rRows[1].push("Ore TOT","€ tot. TOT","€ fin. TOT","€ cof. TOT");
    var rP=["Personale"],rB=["Beni/Servizi"],rT=["TOTALE"];

      var oE=pC.reduce(function(a,c){return a+(c.yrs[yi]?c.yrs[yi].oE:0)},0);
      var iEP=pC.reduce(function(a,c){return a+(c.yrs[yi]?c.yrs[yi].iE:0)},0);
      var iFP=pC.reduce(function(a,c2){var yc2=c2.yrs[yi];return a+(yc2?yc2.iE*yc2.yI/100:0)},0);
      var iCP=pC.reduce(function(a,c2){var yc2=c2.yrs[yi];return a+(yc2?yc2.iE*yc2.yJ/100:0)},0);
      rP.push(oE,iEP,iFP,iCP);
      var iEB=bC.reduce(function(a,c){return a+(c.yrs[yi]?c.yrs[yi].iE:0)},0);
      var iFB=bC.reduce(function(a,c2){var yc2=c2.yrs[yi];return a+(yc2?yc2.iE*yc2.yI/100:0)},0);
      var iCB=bC.reduce(function(a,c2){var yc2=c2.yrs[yi];return a+(yc2?yc2.iE*yc2.yJ/100:0)},0);
      rB.push("—",iEB,iFB,iCB);
      rT.push(oE,iEP+iEB,iFP+iFB,iCP+iCB);
    });
    rP.push(pC.reduce(function(a,c){return a+c.tO},0),pC.reduce(function(a,c){return a+c.tI},0),pC.reduce(function(a,c){return a+c.EX},0),pC.reduce(function(a,c){return a+c.tI-c.EX},0));
    rB.push("—",bC.reduce(function(a,c){return a+c.tI},0),bC.reduce(function(a,c){return a+c.EX},0),bC.reduce(function(a,c){return a+c.tI-c.EX},0));
    var totOre=pC.reduce(function(a,c){return a+c.tO},0);var totI=pC.reduce(function(a,c){return a+c.tI},0)+bC.reduce(function(a,c){return a+c.tI},0);

    XLSX.writeFile(wb,data.title.replace(/[^a-zA-Z0-9 ]/g,"")+" - Report.xlsx");

  const thF={padding:"3px 4px",textAlign:"center",fontSize:9,border:"1px solid #b0bcc8",fontWeight:700,color:"#1e293b",borderBottom:"2px solid #e2e8f0",whiteSpace:"nowrap",fontFamily:"'Nunito','Segoe UI',sans-serif"};

        <div style={{marginTop:4,display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>{cy.map(function(y,yi){var f=(data.finAnno&&data.finAnno[yi])||0;var rett=(data.rettFin&&data.rettFin[yi])||0;return<span key={yi} style={{fontSize:9,padding:"2px 8px",borderRadius:4,fontWeight:700,background:f>0?"#dcfce7":"#fee2e2",color:f>0?"#166534":"#991b1b",border:"1px solid "+(f>0?"#bbf7d0":"#fca5a5"),display:"inline-flex",alignItems:"center",gap:4}}>{y.year+": "+(f>0?"✓ "+fmtE(f):"da inserire")}{f>0&&<button onClick={function(){proponiPropagazione(yi)}} title="Verifica eccedenza e propaga sull'anno successivo" style={{background:"#f59e0b",color:"#fff",border:"none",borderRadius:3,fontSize:8,fontWeight:700,padding:"1px 4px",cursor:"pointer"}}>⇄ propaga</button>}{rett>0&&<span title="Rettifica: finanziato a budget ridotto per eccedenza anno precedente" style={{background:"#fef3c7",color:"#92400e",border:"1px solid #fde68a",borderRadius:3,fontSize:8,fontWeight:700,padding:"1px 4px",cursor:"pointer"}} onClick={function(){resetRett(yi)}}>−{fmtE(rett)} ✕</span>}</span>})}</div>

          {P.map(function(p,i){var c=pC[i],yc=c.yrs[aYI];if(!yc)return null;var resI=yc.oR*(yc.eRate||p.eur);return(

          });
          var anniSfor=[];
          cy.forEach(function(y,yi){if(cofRealY[yi]>cofBudY[yi]+0.01)anniSfor.push({year:y.year,prev:cofBudY[yi],real:cofRealY[yi],extra:cofRealY[yi]-cofBudY[yi]})});
          if(anniSfor.length===0)return null;
          return(<div style={{marginTop:4,padding:"8px 10px",background:"#fff7ed",borderRadius:4,border:"2px solid #f59e0b",fontSize:10,fontFamily:"'Nunito','Segoe UI',sans-serif"}}>
            <div style={{fontWeight:800,color:"#b45309",marginBottom:3}}>⚠ COFINANZIAMENTO REALE SUPERIORE AL PREVISTO</div>
            <div style={{color:"#475569",lineHeight:1.6}}>
              La spesa ha superato il preventivo e il finanziamento del Comune è al tetto: l'eccedenza ricade come maggiore cofinanziamento a carico di Spazio Ireos.
              {anniSfor.map(function(a){return<div key={a.year} style={{marginTop:2}}><strong style={{color:YCT[(cy.findIndex(function(y){return y.year===a.year}))%8]}}>{a.year}</strong>: cofin. previsto <strong>{fmtE(a.prev)}</strong> → reale <strong style={{color:"#b45309"}}>{fmtE(a.real)}</strong> <strong style={{color:"#dc2626"}}>(+{fmtE(a.extra)})</strong></div>})}
            </div>
          </div>);
        }()}
        </div>)
      }()}
    </div>

    {/* === SEPARATORE */}
    <div style={{borderTop:"3px solid #1e293b",marginTop:8}}></div>
    {/* === FATTURAZIONE === */}
    <div style={{background:"#fff",borderRadius:6,border:"1px solid #e2e8f0",marginTop:4,padding:"6px 10px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
        <div style={{fontSize:11,fontWeight:700,color:"#1e293b"}}>FATTURAZIONE AL COMMITTENTE</div>
        <button onClick={addFatt} style={{...bSec,fontSize:9,padding:"3px 8px"}}>+ Aggiungi fattura</button>
      </div>
      {FT.length>0&&<table style={{borderCollapse:"collapse",fontSize:10,width:"100%",border:"1px solid #94a3b8",fontFamily:"'Nunito','Segoe UI',sans-serif"}}>
        <thead><tr style={{background:"#fff"}}>
          <th style={{...thF,textAlign:"center",minWidth:30}}>N°</th>
          <th style={{...thF,minWidth:100}}>Data</th>
          <th style={{...thF,minWidth:80}}>N° Fattura</th>
          <th style={{...thF,minWidth:80}}>Tipo</th>
          <th style={{...thF,minWidth:100}}>Importo</th>
          <th style={{...thF,minWidth:30}}></th>
        </tr></thead>
        <tbody>
          {FT.map(function(ft,i){return(
            <tr key={i} style={{borderBottom:"1px solid #e2e8f0"}}>
              <td style={{...tdF,fontWeight:700,color:"#64748b"}}>{i+1}</td>
              <td style={tdF}><In value={ft.data} onChange={function(v){updFatt(i,"data",v)}} type="date" w={120}/></td>
              <td style={tdF}><In value={ft.numero} onChange={function(v){updFatt(i,"numero",v)}} type="text" w={100}/></td>
              <td style={tdF}><Sel value={ft.tipo} onChange={function(v){updFatt(i,"tipo",v)}} options={[{v:"acconto",l:"Acconto"},{v:"saldo",l:"Saldo"}]} w={90}/></td>
              <td style={tdF}><NumIn value={ft.importo} onChange={function(v){updFatt(i,"importo",v)}} w={110} eur={true}/></td>
              <td style={tdF}><button onClick={function(){delFatt(i)}} style={{background:"none",border:"none",color:"#dc2626",cursor:"pointer",fontSize:12}}>✕</button></td>
            </tr>)})}
        </tbody>
      </table>}
      {FT.length===0&&<div style={{padding:"8px 0",color:"#94a3b8",fontSize:10,textAlign:"center"}}>Nessuna fattura registrata</div>}
      {function(){var totFatt=FT.reduce(function(a,f){return a+f.importo},0);var totAcconti=FT.filter(function(f){return f.tipo==="acconto"}).reduce(function(a,f){return a+f.importo},0);var totSaldi=FT.filter(function(f){return f.tipo==="saldo"}).reduce(function(a,f){return a+f.importo},0);var totSpesoFin=pC.reduce(function(a,c){return a+c.EX},0)+bC.reduce(function(a,c){return a+c.EX},0);var budgetFin=pC.reduce(function(a,c){return a+c.F*c.I/100},0)+bC.reduce(function(a,c){return a+c.F*c.I/100},0);var diffSpeso=totFatt-totSpesoFin;var diffBudget=budgetFin-totFatt;return(
        <div style={{display:"flex",gap:8,marginTop:6,flexWrap:"wrap"}}>
          <div style={{flex:1,minWidth:130,padding:"6px 8px",background:"#f8fafc",borderRadius:6,border:"1px solid #e2e8f0"}}>
            <div style={{fontSize:8,color:"#64748b"}}>Totale fatturato</div>
            <div style={{fontSize:13,fontWeight:700,color:"#1e293b"}}>{fmtE(totFatt)}</div>
            <div style={{fontSize:8,color:"#94a3b8"}}>Acconti: {fmtE(totAcconti)} · Saldi: {fmtE(totSaldi)}</div>
          </div>
          <div style={{flex:1,minWidth:130,padding:"6px 8px",background:"#fff",borderRadius:6,border:"1px solid #bfdbfe"}}>
            <div style={{fontSize:8,color:"#2563eb"}}>Speso finanziato</div>
            <div style={{fontSize:13,fontWeight:700,color:"#2563eb"}}>{fmtE(totSpesoFin)}</div>
          </div>
          <div style={{flex:1,minWidth:130,padding:"6px 8px",background:diffSpeso>=0?"#fffbeb":"#f0fdf4",borderRadius:6,border:"1px solid "+(diffSpeso>=0?"#fde68a":"#bbf7d0")}}>
            <div style={{fontSize:8,color:diffSpeso>=0?"#92400e":"#166534"}}>Fatturato vs Speso fin.</div>
            <div style={{fontSize:13,fontWeight:700,color:diffSpeso>0.01?"#d97706":diffSpeso<-0.01?"#16a34a":"#1e293b"}}>{diffSpeso>0.01?"Fatturato "+fmtE(diffSpeso)+" in più":diffSpeso<-0.01?"Da fatturare ancora "+fmtE(Math.abs(diffSpeso)):"✓ Allineato"}</div>
          </div>
          <div style={{flex:1,minWidth:130,padding:"6px 8px",background:diffBudget>=0?"#f0fdf4":"#fef2f2",borderRadius:6,border:"1px solid "+(diffBudget>=0?"#bbf7d0":"#fca5a5")}}>
            <div style={{fontSize:8,color:diffBudget>=0?"#166534":"#991b1b"}}>Budget fin. residuo</div>
            <div style={{fontSize:13,fontWeight:700,color:diffBudget>=0?"#16a34a":"#dc2626"}}>{fmtE(diffBudget)}</div>
            <div style={{fontSize:8,color:"#94a3b8"}}>su {fmtE(budgetFin)} totale</div>
          </div>
        </div>)
      }()}
    </div>

    </div>

  </div>);
}

ReactDOM.render(<ErrorBoundary><App/></ErrorBoundary>,document.getElementById('root'));
</script>
</body>
</html>
