}

function PV({pid,onBack}){
  const[data,setData]=useState(null);const propagRef=useRef(false);useEffect(function(){return function(){_dirtyKV=false}},[]);const[aYI,setAYI]=useState(0);const[mo,setMo]=useState(false);const[resV,setResV]=useState(false);const[saved,setSaved]=useState(false);const[finAlertDismissed,setFinAlertDismissed]=useState(false);const[debtDetail,setDebtDetail]=useState(null);
  const[riassExp,setRiassExp]=useState({});
  const[riassQty,setRiassQty]=useState({});
  const[riassTo,setRiassTo]=useState({});
  useEffect(()=>{
    try{
      _dirtyKV=false;const r=LS.get("usoint-p-"+pid);
      if(r){
        var d=JSON.parse(r.value);
        if(!d.fatture)d.fatture=[];
        if(!d.colore)d.colore="#e3f0fc";
        var nYrs=calcCY(d.start,d.end).length||10;
        if(!d.finAnno)d.finAnno=Array(nYrs).fill(0);
        if(!d.rettFin)d.rettFin=Array(nYrs).fill(0);
        if(!d.propag)d.propag=[];
        (d.personnel||[]).forEach(function(p){
          if(p.cessato===undefined)p.cessato="";
          if(!p.eurA)p.eurA=Array(nYrs).fill(0);
          if(!p.aElim)p.aElim=Array(nYrs).fill(0);
          if(!p.aOre)p.aOre=Array(nYrs).fill(0);
          if(p.ricevute===undefined)p.ricevute=0;
          if(!p.recBlk)p.recBlk=[];
          if(p.recBlk.length){p.ricevute=Math.round(p.recBlk.reduce(function(a,b){return a+(b.ore||0)},0)*100)/100}
          if(!p.md)p.md=Array.from({length:nYrs},function(){return Array(12).fill(0)});
        });
        (d.beni||[]).forEach(function(b){
          if(b.cessato===undefined)b.cessato="";
          if(!b.aElim)b.aElim=Array(nYrs).fill(0);
          if(!b.aImp)b.aImp=Array(nYrs).fill(0);
          if(b.ricevute===undefined)b.ricevute=0;
          if(!b.recBlk)b.recBlk=[];
          if(b.recBlk.length){b.ricevute=Math.round(b.recBlk.reduce(function(a,x){return a+(x.imp||0)},0)*100)/100}
          if(!b.md)b.md=Array.from({length:nYrs},function(){return Array(12).fill(0)});
        });
        setData(d);
      }
    }catch(ex){console.error("Errore caricamento progetto:",ex)}
  },[pid]);
  const save=()=>{setData(prev=>{if(prev)LS.set("usoint-p-"+pid,JSON.stringify(prev));return prev});_dirtyKV=false;setSaved(true);setTimeout(()=>setSaved(false),1500)};
  const upd=fn=>{_dirtyKV=true;setData(prev=>fn(prev))};
  const rinominaTitolo=()=>{
    var att=(data&&data.title)||"";
    var nuovo=prompt("Rinomina il lavoro:",att);

          <div style={{flex:1,minWidth:130,padding:"6px 8px",background:diffBudget>=0?"#f0fdf4":"#fef2f2",borderRadius:6,border:"1px solid "+(diffBudget>=0?"#bbf7d0":"#fca5a5")}}>
            <div style={{fontSize:8,color:diffBudget>=0?"#166534":"#991b1b"}}>Budget fin. residuo</div>
            <div style={{fontSize:13,fontWeight:700,color:diffBudget>=0?"#16a34a":"#dc2626"}}>{fmtE(diffBudget)}</div>
            <div style={{fontSize:8,color:"#94a3b8"}}>su {fmtE(budgetFin)} totale</div>
          </div>
        </div>)
      }()}
    </div>

    </div>

  </div>);
}

ReactDOM.render(<ErrorBoundary><App/></ErrorBoundary>,document.getElementById('root'));
</script>
</body>
